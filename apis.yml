description: >-
  SemGroup Corporation was a Tulsa, Oklahoma midstream energy service provider that
  gathered, transported, stored, processed, and marketed crude oil, refined products, and
  natural gas liquids across North America, and operated the Houston Fuel Oil Terminal
  (HFOTCO) on the Houston Ship Channel. Energy Transfer LP acquired SemGroup in a $5.1
  billion transaction that closed on December 5, 2019; the company was absorbed into
  Energy Transfer, its NYSE listing retired, and www.semgroup.com now redirects to
  energytransfer.com. SemGroup never operated a public developer program or API.
